# Every push to main runs the same build checks as a PR before Release Please updates the release PR
# or tags a release. Nothing is attached: people build the full IPA themselves (README).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release-please:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
