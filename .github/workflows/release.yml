# Every push to main runs the same build checks as a PR before Release Please updates the release PR
# or tags a release. Nothing is attached: people build the full IPA themselves (README).
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release-please:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Release Please acts on main, not the triggering SHA; skip reruns of stale commits.
      - name: Check verified commit is still at the tip of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: googleapis/release-please-action@v4
        if: steps.head.outputs.current == 'true'
