name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      # Mask before passing the URL as env; the runner logs the step's environment before it runs.
      - name: Validate and mask IPA URL
        shell: bash
        run: |
          if ! ipa_url="$(jq -er '.inputs.ipa_url | strings | select(test("\\Ahttps?://[^[:space:][:cntrl:]]+\\z"))' "$GITHUB_EVENT_PATH")"; then
            echo "::error::Expected an HTTP(S) IPA URL without unencoded whitespace"
            exit 1
          fi
          printf '::add-mask::%s\n' "${ipa_url//%/%25}"

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
          persist-credentials: false

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        shell: bash
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          mkdir -p ipa
          if ! curl --disable --fail --silent --location --globoff --proto '=http,https' \
            --proto-redir '=http,https' --output ipa/spotify.ipa -- "$IPA_URL"; then
            echo "::error::Could not download the IPA"
            exit 1
          fi
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - run: make release

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: vitrine.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="vitrine-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
